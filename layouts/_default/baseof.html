<!doctype html>
<html lang="{{ site.Language.Locale | default "en-US" }}" data-theme="dark">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="page-{{ .Kind }} section-{{ .Section | default "home" }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $script := resources.Get "js/main.js" | minify | fingerprint }}
    <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
  </body>
</html>
